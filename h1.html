<!DOCTYPE html>
<html>
    <head>
        <title>Create and draw ROOT histograms</title>
        <script type="text/javascript" src="qrc:/js/webchannel/qwebchannel.js"></script>
        <!-- <script type="text/javascript" src="https://root.cern/js/latest/build/jsroot.js"></script> -->
        <script type="text/javascript" src="qrc:/js/jsroot/build/jsroot.js"></script>
    </head>
    <body>
        <div id="canvas" style="margin:auto; width: 600px; height: 600px;"> </div>

        <script>
         var updateH1 = function(data) {
             let h1 = JSROOT.createHistogram('TH1I', 100);
             h1.fXaxis.fXmin = -5;
             h1.fXaxis.fXmax = 5;
             for (let i = 0; i < data.length; i++) {
                 h1.Fill(data[i]);
             }
             h1.fName = 'h1generated';
             h1.fTitle = 'Gaussion';
             JSROOT.redraw('canvas', h1);
         }

         window.onload = function(){
             new QWebChannel(qt.webChannelTransport,
                             function(channel) {
                                 var dataSource = channel.objects.dataSource;
                                 dataSource.dataH1Changed.connect(updateH1);
                             }
             );
         }
        </script>
    </body>
</html>
